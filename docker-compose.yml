services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: albert
      POSTGRES_PASSWORD: albert
      POSTGRES_DB: albert_erp
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albert"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
